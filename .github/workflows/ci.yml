name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment after the first release
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install repository script dependencies
        run: python -m pip install -r scripts/requirements.txt

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Desktop CDP types and behavioral tests
        run: |
          for dir in scripts/shared skills/teams-cdp/scripts skills/m365-copilot-cdp/scripts; do
            (cd "$dir" && bun install --frozen-lockfile && bun run check && bun test)
          done

      - name: Shared script drift check
        run: python scripts/vendor_shared.py --check

      - name: Skill catalog drift check
        run: python scripts/generate_index.py --check

      - name: Index generator tests
        run: python scripts/test_generate_index.py

      - name: Unified version and catalog check
        run: python scripts/version.py check

      - name: Unified version tests
        run: python scripts/test_version.py

      - name: Automatic release tests (isolated local Git remotes)
        run: python scripts/test_release.py

      - name: ghc-search tests
        run: python skills/ghc-search/scripts/test_ghc_search.py

      - name: my-ado-cppr tests
        working-directory: skills/my-ado-cppr
        run: python -m unittest lib.test_run

      - name: hoa-introspect evals
        run: python skills/hoa-introspect/evals/run.py

      - name: hoa-introspect-distill evals
        run: python skills/hoa-introspect-distill/evals/run_evals.py

      - name: hoa-agent-retrieve evals
        run: python skills/hoa-agent-retrieve/evals/run_evals.py

      - name: git-worktree-workflow tests
        run: bash skills/git-worktree-workflow/scripts/test_gitwt.sh
      - name: define-goal fixture validation
        run: python skills/define-goal/evals/validate_fixtures.py

      - name: Trigger-eval case validation
        run: python evals/run_trigger_evals.py

      - name: Skill-method case validation
        run: python evals/validate_skill_method_cases.py

      - name: Skill-method setup isolation tests
        run: python -m unittest evals.test_validate_skill_method_cases

      - name: SKILL.md frontmatter sanity
        run: |
          shopt -s nullglob
          files=(skills/*/SKILL.md)
          [ ${#files[@]} -gt 0 ] || { echo "no SKILL.md files found"; exit 1; }
          for f in "${files[@]}"; do
            head -1 "$f" | grep -q '^---$' || { echo "missing frontmatter: $f"; exit 1; }
            name_val=$(grep -m1 '^name:' "$f" | sed 's/^name:[[:space:]]*//')
            [ -n "$name_val" ] || { echo "empty name: $f"; exit 1; }
            desc_val=$(grep -m1 '^description:' "$f" | sed 's/^description:[[:space:]]*//')
            [ -n "$desc_val" ] || { echo "empty description: $f"; exit 1; }
          done

  release:
    needs: test
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install repository script dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Publish tested main version
        env:
          RELEASE_PART: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'patch' }}
        run: python scripts/release.py --part "$RELEASE_PART"
