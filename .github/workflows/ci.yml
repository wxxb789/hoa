name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # ── provisioning: runtimes and dependencies the discoverer's suites declare ──
      # The per-suite commands these steps used to spell out one by one now live in
      # scripts/test_manifest.toml, which scripts/run_all_tests.py applies.
      - uses: actions/checkout@v4
        with:
          # The version and changelog gates read origin/main.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The Paseo plugin package needs npm; its README documents Node 20.19.4+.
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"

      - name: Install repository script dependencies
        run: python -m pip install -r scripts/requirements.txt

      # ── every suite: discovered patterns, declared gates, declared packages ──
      - name: Repository test discoverer
        run: python scripts/run_all_tests.py

