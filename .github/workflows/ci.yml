name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # ── provisioning: runtimes and dependencies the discoverer's suites declare ──
      # The per-suite commands these steps used to spell out one by one now live in
      # scripts/test_manifest.toml, which scripts/run_all_tests.py applies.
      - uses: actions/checkout@v4
        with:
          # The version and changelog gates read origin/main.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      # The Paseo plugin package needs npm; its README documents Node 20.19.4+.
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"

      - name: Install repository script dependencies
        run: python -m pip install -r scripts/requirements.txt

      # ── every suite: discovered patterns, declared gates, declared packages ──
      - name: Repository test discoverer
        run: python scripts/run_all_tests.py

  release:
    needs: test
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install repository script dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Publish tested main version
        run: python scripts/release.py
