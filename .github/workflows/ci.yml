name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to a PR supersedes the older run; every other run gets its own group (run_id),
  # because a shared group would still drop a queued main run when a newer one arrives.
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # check-revisions needs the merge base with origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: python -m pip install -r scripts/requirements.txt

      # Static gates
      - name: Frontmatter
        run: python scripts/check_frontmatter.py
      - name: Contract graph
        run: python scripts/check_contract_graph.py
      - name: Skill links
        run: python scripts/check_skill_links.py
      - name: Catalog index drift
        run: python scripts/generate_index.py --check
      - name: Vendored shared scripts drift
        run: python scripts/vendor_shared.py --check
      - name: PR bumps changed skills' revision
        if: github.event_name == 'pull_request'
        run: python scripts/version.py check-revisions

      # Python tests: every test_*.py under scripts/ evals/ skills/ (pytest.ini)
      - name: pytest
        timeout-minutes: 12
        run: python -m pytest

      # Script checks: the exit code is the contract
      - name: Trigger cases
        run: python evals/run_trigger_evals.py
      - name: Skill-method cases
        run: python evals/validate_skill_method_cases.py
      - name: define-goal fixtures
        run: python skills/define-goal/evals/validate_fixtures.py
      - name: hermes-models routing inventory
        run: python skills/hermes-models/scripts/tests/test-routing-inventory.py
      - name: hermes-models provider metadata
        run: python skills/hermes-models/scripts/tests/test-provider-metadata.py
      - name: gdd verdict matrix
        run: python skills/gdd/scripts/tests/test_verdict_matrix.py
      - name: gdd merge-gate mutation harness
        timeout-minutes: 5
        run: python skills/gdd/scripts/tests/mutate_verdict_matrix.py

  # Paseo gdd-observer plugin: every OS the plugin ships to runs the same checks
  # in parallel, and one platform failing must not cancel the others.
  gdd-observer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: paseo-plugins/gdd-observer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"  # plugin README minimum
          cache: npm
          cache-dependency-path: paseo-plugins/gdd-observer/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  gdd-runner:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: python -m pip install -r scripts/requirements.txt
      - name: Shared gdd runner, dispatch, and watcher contracts
        env:
          PYTHONPATH: ${{ runner.os == 'Windows' && format('{0}/skills/gdd/scripts/tests/nowindow', github.workspace) || '' }}
        run: >-
          python -m pytest -q
          skills/gdd/scripts/tests/test_agent_run.py
          skills/gdd/scripts/tests/test_detach_supervisors.py
          skills/gdd/scripts/tests/test_gdd.py
          skills/gdd/scripts/tests/test_no_window.py
          skills/gdd/scripts/tests/test_paseo_run_python.py
          skills/gdd/scripts/tests/test_watch_pr_checks.py
