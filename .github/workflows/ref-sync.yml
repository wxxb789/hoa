name: Ref sync

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ref-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Deploy key on the main ruleset bypass list; GITHUB_TOKEN cannot bypass the PR rule.
          ssh-key: ${{ secrets.REF_SYNC_DEPLOY_KEY }}
      - name: Advance every ref/ submodule to its upstream branch head
        # --checkout overrides the update = none that keeps installs from cloning ref/.
        run: git submodule update --init --checkout --remote --depth 1 --jobs 8
      - name: Push changed pointers to main
        run: |
          git add ref
          if git diff --cached --quiet; then
            echo "All ref/ submodules already at upstream heads."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(ref): sync submodules to upstream heads"
          git push origin HEAD:main
