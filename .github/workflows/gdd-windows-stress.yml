name: GDD Windows lifecycle stress

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: ${{ github.workspace }}/skills/engineering/gdd/scripts/tests/nowindow
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Run ten serial lifecycle passes
        timeout-minutes: 20
        run: uv run --python 3.13 --with-requirements scripts/requirements.txt --script skills/engineering/gdd/scripts/tests/stress_windows.py "${{ runner.temp }}/gdd-stress"
      - name: Upload pytest and teardown diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gdd-windows-stress
          path: |
            ${{ runner.temp }}/gdd-stress/
            !${{ runner.temp }}/gdd-stress/*/*-tmp/source/**
          retention-days: 14
          include-hidden-files: true
