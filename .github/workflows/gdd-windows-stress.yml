name: GDD Windows lifecycle stress

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: ${{ github.workspace }}/skills/gdd/scripts/tests/nowindow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: python -m pip install -r scripts/requirements.txt
      - name: Run ten serial lifecycle passes
        timeout-minutes: 20
        run: python skills/gdd/scripts/tests/stress_windows.py "${{ runner.temp }}/gdd-stress"
      - name: Upload pytest and teardown diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdd-windows-stress
          path: |
            ${{ runner.temp }}/gdd-stress/
            !${{ runner.temp }}/gdd-stress/*/*-tmp/source/**
          retention-days: 14
          include-hidden-files: true
