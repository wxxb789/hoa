name: Dependabot Submodule Auto-Merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3.1.0
      - name: Enable squash auto-merge
        # fetch-metadata reads the branch slug, where gitsubmodule is named submodules.
        if: steps.metadata.outputs.package-ecosystem == 'gitsubmodule' || steps.metadata.outputs.package-ecosystem == 'submodules'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
