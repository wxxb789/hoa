version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /paseo-plugins/gdd-observer
    schedule:
      interval: weekly
    groups:
      gdd-observer:
        patterns:
          - "*"
