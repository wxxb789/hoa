version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /paseo-plugins/gdd-observer
    schedule:
      interval: weekly
    ignore:
      # These follow the Paseo host; update them together with @getpaseo/plugin.
      - dependency-name: react
      - dependency-name: react-native
      - dependency-name: react-test-renderer
      - dependency-name: "@types/react"
      - dependency-name: "@types/react-test-renderer"
      # Match the Observer's minimum supported Node.js major.
      - dependency-name: "@types/node"
        versions: [">=21"]
      # Vitest 5 drops support for Node.js 20.
      - dependency-name: vitest
        versions: [">=5 <6"]
    groups:
      gdd-observer:
        patterns:
          - "*"
