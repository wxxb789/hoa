[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hoa-cli"
version = "0.1.0"
description = "Decision rubrics, session history mining, and rubric evaluation"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
hoa = "hoa_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hoa_cli"]
