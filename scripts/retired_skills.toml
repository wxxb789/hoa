# scripts/retired_skills.toml — data for scripts/install_host_skills.py --check
#
# Skill names this repository no longer ships: renamed, split, merged or retired.
# `--check` reports a host entry under a retired name and never deletes it; the
# operator removes it (keep a backup).  A retired name must not be a current
# skill.  Add an entry in the same change that renames or removes a skill.
#
#   [retired.<old-name>]
#   replacement  current skill name, the repo path or the tool that replaces it
#   reason       one line: why the name went away

[retired.to-prd]
replacement = "notes-to-prd"
reason = "older name of the same skill (2026-11-13)"

[retired.to-issues]
replacement = "plan-to-issues"
reason = "older name of the same skill (2026-11-13)"

