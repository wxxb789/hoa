# scripts/retired_skills.toml — data for scripts/generate_index.py
#
# Skill names this repository no longer ships: renamed, split, merged or retired.
# generate_index.py turns them into the `npx skills remove -g …` line in index.md;
# users run it and then re-run their add command.  A retired name must not be a
# current skill.  Add an entry in the same change that renames or removes a skill.
#
#   [retired.<old-name>]
#   replacement  current skill name, the repo path or the tool that replaces it
#   reason       one line: why the name went away

[retired.to-prd]
replacement = "ce-plan"
reason = "older name of the same skill (2026-11-13)"

[retired.to-issues]
replacement = "to-tickets"
reason = "older name of the same skill (2026-11-13)"

# Do not list improve-codebase-architecture: the name-only command would
